[package]
name = "wall"
version = "0.1.0"
edition = "2024"
authors = ["Milan Gallo gallo.milan.jr@gmail.com"]
description = "A High-Performance Concurrent Log Aggregator & Metrics Pipeline in Rust."
default-run = "wall"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
